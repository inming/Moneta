[package]
name = "moneta"
version = "0.1.0"
description = "个人/家庭桌面端记账软件"
edition = "2021"
license = "MIT"

[lib]
name = "moneta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
dirs = "6.0.0"
sys-locale = "0.3.2"
hex = "0.4.3"
base64 = "0.22.1"
rand = "0.10.1"
sha2 = "0.11.0"
chrono = "0.4.45"
log = "0.4.32"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
include_dir = "0.7.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri-plugin-dialog = "2.7.1"
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors"] }
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.135.0"
aes-gcm = "0.10.3"
pbkdf2 = "0.13.0"
flate2 = "1.1.9"
hmac = "0.13.0"

[workspace]
members = ["mcp-sidecar"]

[patch.crates-io]
# 捆绑的 sqlite3 被替换为 SQLite3MultipleCiphers 2.3.3 amalgamation，
# 与旧 Electron 端 better-sqlite3-multiple-ciphers 12.9.0 完全同版本，
# 保证 chacha20 加密库文件格式互通（见 docs/architecture/database-encryption.md）
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
aes = "0.9.1"
cbc = "0.2.1"
pbkdf2 = "0.13.0"
security-framework = "3.7.0"
sha1 = "0.11.0"

[target."cfg(windows)".dependencies]
aes-gcm = "0.10.3"
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
